gui:
  language: 'en'
  border: 'rounded'
  theme:
    lightTheme: false
    activeBorderColor:
      - cyan
      - bold
    selectedLineBgColor:
      - default
git:
  diffRenderers:
    - colorArg: always
      command: delta  --dark --paging=never --24-bit-color=never --syntax-theme="OneHalfDark"
os:
  editPreset: 'nvim'
